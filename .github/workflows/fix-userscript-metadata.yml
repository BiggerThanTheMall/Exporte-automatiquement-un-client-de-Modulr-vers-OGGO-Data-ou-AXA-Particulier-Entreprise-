name: Fix userscript metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-userscript-metadata.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch metadata only
        shell: python
        run: |
          from pathlib import Path
          p = Path('Modulr-Export-Client-OGGO-AXA.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @version      4.10.0', '// @version      4.10.1', 1)
          s = s.replace('https://raw.githubusercontent.com/BiggerThanTheMall/tampermonkey-ltoa/main/Modulr-Export-Client-OGGO-AXA.user.js', 'https://raw.githubusercontent.com/BiggerThanTheMall/Exporte-automatiquement-un-client-de-Modulr-vers-OGGO-Data-ou-AXA-Particulier-Entreprise-/main/Modulr-Export-Client-OGGO-AXA.user.js')
          p.write_text(s, encoding='utf-8')
      - name: Commit metadata fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Modulr-Export-Client-OGGO-AXA.user.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Tampermonkey update URLs and bump version to 4.10.1"
          git push
